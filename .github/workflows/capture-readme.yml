name: Capture authentic README screenshots
on:
  push:
    branches: [docs/portfolio-readme-20261123]
    paths:
      - .github/workflows/capture-readme.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio
      - uses: actions/checkout@v4
        with:
          repository: roxanehe/ruoxin-he-brainflix
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: roxanehe/ruoxin-he-brainflix-api
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Fix historical import-case mismatches in ephemeral runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replaces={
            "frontend/src/App.js": {
              "./pages/SingleVideo.jsx":"./pages/Singlevideo.jsx",
              "./components/UploadSuccess/UploadSuccess.jsx":"./components/Uploadsuccess/UploadSuccess.jsx",
            },
            "frontend/src/pages/Singlevideo.jsx":{
              "../components/VideoView/VideoView.jsx":"../components/Videoview/Videoview.jsx",
              "./SingleVideo.scss":"./Singlevideo.scss",
            },
            "frontend/src/components/Videoview/Videoview.jsx":{
              "./VideoView.scss":"./Videoview.scss",
            },
            "frontend/src/components/Uploadsuccess/UploadSuccess.jsx":{
              "./UploadSuccess.scss":"./Uploadsuccess.scss",
            },
          }
          for name,patches in replaces.items():
            p=Path(name);s=p.read_text()
            for a,b in patches.items():s=s.replace(a,b)
            p.write_text(s)
          PY
      - name: Start original Express API
        working-directory: backend
        run: |
          npm ci
          PORT=8000 node index.js >/tmp/brainflix-api.log 2>&1 &
          echo $! > /tmp/brainflix-api.pid
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8000/videos/ >/dev/null; then break; fi; sleep 2; done
          curl -f http://127.0.0.1:8000/videos/ | head -c 300
      - name: Start original React frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          CI=false DISABLE_ESLINT_PLUGIN=true BROWSER=none npm start >/tmp/brainflix-frontend.log 2>&1 &
          echo $! > /tmp/brainflix-frontend.pid
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          curl -fI http://127.0.0.1:3000
      - name: Capture real browser pages
        working-directory: portfolio
        run: |
          set -e
          mkdir -p docs/screenshots
          CHROME=$(command -v google-chrome || command -v chromium || true)
          echo "Chrome: $CHROME"
          if [ -z "$CHROME" ]; then echo "Headless Chrome unavailable"; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,970 --virtual-time-budget=11000 --screenshot=docs/screenshots/video-detail.png http://127.0.0.1:3000/
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,970 --virtual-time-budget=11000 --screenshot=docs/screenshots/upload-metadata.png http://127.0.0.1:3000/upload
          file docs/screenshots/*.png
          ls -lh docs/screenshots
      - name: Commit screenshots to README portfolio repo
        working-directory: portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture real Brainflix video and upload screens"
          git push origin HEAD:docs/portfolio-readme-20261123
